version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bridge-relayer-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bridge_relayer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridge-relayer
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bridge_relayer
    depends_on:
      - postgres

volumes:
  pgdata:
